pages:
  stage: deploy
  needs: 
    - yarn:install
#    - test:gatsby
  script:
    - yarn install --frozen-lockfile --check-files --non-interactive --cache-folder .yarn
    - yarn run build
  cache:
    paths:
    - .yarn
    - node_modules
    - package-lock.json
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
